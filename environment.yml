# Entorno de la tesis: Conteo de rocas visibles basado en las máscaras de AI4Mars
# Autor: Juan Pablo Delgado Castro — Universidad Externado de Colombia
#
# Reproduce TODOS los resultados del documento: pipeline clásico (E1, E2), análisis
# estadísticos, segmentador DeepLabV3, comparación con FastSAM, figuras, cifras de la tesis,
# aplicación de consulta y pruebas. Las versiones son las de la ejecución final
# (Python 3.13.13, conda-forge, Apple Silicon); requirements-lock.txt registra el entorno
# exacto, paquete por paquete.
#
#     conda env create -f environment.yml
#     conda activate tesis-marte
#
# Lo relativo a AWS (notebook 05 y scripts/rekognition_test.py, exploración descartada que no
# alimenta ningún resultado de la tesis) está en environment-aws.yml.

name: tesis-marte

channels:
  - conda-forge

dependencies:
  # --- Núcleo y pipeline clásico (E1, E2) ---
  - python=3.13.13
  - pip
  - numpy=2.5.1
  - scipy=1.18.0
  - scikit-image=0.26.0
  - pandas=3.0.5
  - pillow=12.3.0
  - matplotlib=3.11.1
  - tqdm=4.67.3

  # --- Análisis estadístico (kappa, información mutua) ---
  - scikit-learn=1.9.0

  # --- Pruebas y entorno de trabajo ---
  - pytest=9.1.1
  - jupyterlab
  - ipykernel
  - requests=2.34.2

  - pip:
      # Segmentador DeepLabV3 (aceleración MPS en Apple Silicon)
      - torch==2.13.0
      - torchvision==0.28.0
      # Comparación con FastSAM
      - ultralytics==8.4.137
      # Aplicación de consulta (app.py)
      - customtkinter==6.0.0
